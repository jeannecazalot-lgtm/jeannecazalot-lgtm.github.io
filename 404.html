<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mochi</title>
<script>
  // GitHub Pages sert cette page pour tout chemin inconnu :
  // /j/ABC123 (joli lien) → /j/?code=ABC123 (la vraie page d'atterrissage)
  var m = location.pathname.match(/^\/j\/([A-Za-z2-9]{4,8})\/?$/);
  if (m) location.replace('/j/?code=' + m[1].toUpperCase());
  else location.replace('/');
</script>
</head>
<body></body>
</html>
